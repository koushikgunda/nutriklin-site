<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriKlin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ffffff;
    --paper-warm: #fdfcf9;
    --ink-deep: #0b4c47;
    --ink-mid: #148078;
    --accent-orange: #ef9422;
    --accent-amber: #fbad2d;
    --warn: #b3541e;
    --line: rgba(11,76,71,0.14);
    --glow-teal: rgba(20,128,120,0.16);
    --glow-orange: rgba(239,148,34,0.16);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink-deep);
    font-family: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  .visually-hidden{
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ambient brand glow — slow, restrained, evokes something quietly growing */
  .field{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .blob{
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .9;
  }
  .blob--teal{
    width: 46vmax; height: 46vmax;
    left: -14vmax; top: -16vmax;
    background: radial-gradient(circle at 40% 40%, var(--glow-teal), transparent 70%);
    animation: driftA 26s ease-in-out infinite;
  }
  .blob--orange{
    width: 40vmax; height: 40vmax;
    right: -12vmax; bottom: -14vmax;
    background: radial-gradient(circle at 60% 60%, var(--glow-orange), transparent 70%);
    animation: driftB 30s ease-in-out infinite;
  }
  @keyframes driftA{
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(3vmax, 2vmax) scale(1.06); }
  }
  @keyframes driftB{
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-2.5vmax, -3vmax) scale(1.08); }
  }

  main{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 44rem;
    padding: 8vh 1.75rem 6vh;
    gap: clamp(1.5rem, 4vh, 2.75rem);
  }

  .mark{
    width: clamp(168px, 26vw, 300px);
    height: auto;
    opacity: 0;
    transform: translateY(10px) scale(.97);
    animation: rise .9s cubic-bezier(.22,.9,.32,1) .1s forwards;
  }

  .eyebrow{
    opacity: 0;
    animation: rise .8s cubic-bezier(.22,.9,.32,1) .38s forwards;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--ink-mid);
    margin: -.5rem 0 0;
  }

  h1{
    opacity: 0;
    animation: rise .9s cubic-bezier(.22,.9,.32,1) .5s forwards;
    margin: 0;
    font-family: "Fraunces", ui-serif, Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.75rem, 8vw, 5.5rem);
    line-height: .98;
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: var(--ink-deep);
  }
  h1 em{
    font-style: italic;
    font-weight: 500;
    font-optical-sizing: auto;
    background: linear-gradient(100deg, var(--ink-mid) 0%, var(--accent-orange) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .rule{
    opacity: 0;
    animation: rise .8s cubic-bezier(.22,.9,.32,1) .68s forwards;
    width: 84px;
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--ink-mid), var(--accent-orange));
    position: relative;
    overflow: hidden;
  }
  .rule::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent);
    width: 40%;
    animation: sheen 3.6s ease-in-out 1.6s infinite;
  }
  @keyframes sheen{
    0% { transform: translateX(-120%); }
    60%, 100% { transform: translateX(280%); }
  }

  .sub{
    opacity: 0;
    animation: rise .8s cubic-bezier(.22,.9,.32,1) .8s forwards;
    margin: 0;
    font-size: clamp(1rem, 1.6vw, 1.15rem);
    line-height: 1.55;
    color: color-mix(in srgb, var(--ink-deep) 72%, transparent);
    max-width: 30rem;
  }

  .signup-wrap{
    opacity: 0;
    animation: rise .8s cubic-bezier(.22,.9,.32,1) .92s forwards;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .65rem;
  }

  .signup{
    display: flex;
    gap: .55rem;
    width: 100%;
    max-width: 25rem;
  }
  .signup input[type="email"]{
    flex: 1;
    min-width: 0;
    padding: .85rem 1.1rem;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--paper-warm);
    color: var(--ink-deep);
    font: inherit;
    font-size: .95rem;
  }
  .signup input[type="email"]::placeholder{
    color: color-mix(in srgb, var(--ink-deep) 42%, transparent);
  }
  .signup input[type="email"]:focus-visible{
    outline: 2px solid color-mix(in srgb, var(--accent-orange) 55%, transparent);
    outline-offset: 2px;
    border-color: var(--ink-mid);
  }
  .signup button{
    flex-shrink: 0;
    padding: .85rem 1.5rem;
    border-radius: 999px;
    border: none;
    background: var(--ink-deep);
    color: #fff;
    font: inherit;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s ease, transform .15s ease;
  }
  .signup button:hover{ background: var(--ink-mid); }
  .signup button:active{ transform: scale(.97); }
  .signup button:disabled{ opacity: .6; cursor: progress; }
  .signup button:focus-visible{
    outline: 2px solid color-mix(in srgb, var(--accent-orange) 55%, transparent);
    outline-offset: 2px;
  }

  @media (max-width: 420px){
    .signup{ flex-direction: column; }
  }

  .signup-msg{
    min-height: 1.3em;
    margin: 0;
    font-size: .85rem;
    line-height: 1.5;
    max-width: 26rem;
  }
  .signup-msg[data-state="success"]{ color: var(--ink-mid); font-weight: 600; }
  .signup-msg[data-state="error"]{ color: var(--warn); }
  .signup-msg a{ color: var(--ink-mid); text-decoration: underline; text-underline-offset: 2px; }

  .signup-count{
    margin: 0;
    font-size: .78rem;
    color: color-mix(in srgb, var(--ink-deep) 55%, transparent);
    font-variant-numeric: tabular-nums;
  }

  footer{
    opacity: 0;
    animation: rise .8s cubic-bezier(.22,.9,.32,1) 1.08s forwards;
    margin-top: .25rem;
    display: flex;
    align-items: center;
    gap: .55rem;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--ink-mid) 70%, transparent);
  }
  footer svg{ width: 13px; height: 13px; animation: sway 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes sway{
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  @keyframes rise{
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .mark, .eyebrow, h1, .rule, .sub, .signup-wrap, footer{ animation: none; opacity: 1; transform: none; }
    .rule::after, .blob, footer svg{ animation: none; }
  }
</style>
</head>

\n    animation: driftB 30s ease-in-out infinite;\n  }\n  @keyframes driftA{\n    0%, 100% { transform: translate(0,0) scale(1); }\n    50% { transform: translate(3vmax, 2vmax) scale(1.06); }\n  }\n  @keyframes driftB{\n    0%, 100% { transform: translate(0,0) scale(1); }\n    50% { transform: translate(-2.5vmax, -3vmax) scale(1.08); }\n  }\n\n  main{\n    position: relative;\n    z-index: 1;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    text-align: center;\n    max-width: 44rem;\n    padding: 8vh 1.75rem 6vh;\n    gap: clamp(1.5rem, 4vh, 2.75rem);\n  }\n\n  .mark{\n    width: clamp(168px, 26vw, 300px);\n    height: auto;\n    opacity: 0;\n    transform: translateY(10px) scale(.97);\n    animation: rise .9s cubic-bezier(.22,.9,.32,1) .1s forwards;\n  }\n\n  .eyebrow{\n    opacity: 0;\n    animation: rise .8s cubic-bezier(.22,.9,.32,1) .38s forwards;\n    font-size: .75rem;\n    font-weight: 600;\n    letter-spacing: .32em;\n    text-transform: uppercase;\n    color: var(--ink-mid);\n    margin: -.5rem 0 0;\n  }\n\n  h1{\n    opacity: 0;\n    animation: rise .9s cubic-bezier(.22,.9,.32,1) .5s forwards;\n    margin: 0;\n    font-family: \"Fraunces\", ui-serif, Georgia, serif;\n    font-weight: 500;\n    font-size: clamp(2.75rem, 8vw, 5.5rem);\n    line-height: .98;\n    letter-spacing: -0.01em;\n    text-wrap: balance;\n    color: var(--ink-deep);\n  }\n  h1 em{\n    font-style: italic;\n    font-weight: 500;\n    font-optical-sizing: auto;\n    background: linear-gradient(100deg, var(--ink-mid) 0%, var(--accent-orange) 100%);\n    -webkit-background-clip: text;\n    background-clip: text;\n    color: transparent;\n  }\n\n  .rule{\n    opacity: 0;\n    animation: rise .8s cubic-bezier(.22,.9,.32,1) .68s forwards;\n    width: 84px;\n    height: 3px;\n    border-radius: 3px;\n    background: linear-gradient(90deg, var(--ink-mid), var(--accent-orange));\n    position: relative;\n    overflow: hidden;\n  }\n  .rule::after{\n    content: \"\";\n    position: absolute;\n    inset: 0;\n    background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent);\n    width: 40%;\n    animation: sheen 3.6s ease-in-out 1.6s infinite;\n  }\n  @keyframes sheen{\n    0% { transform: translateX(-120%); }\n    60%, 100% { transform: translateX(280%); }\n  }\n\n  .sub{\n    opacity: 0;\n    animation: rise .8s cubic-bezier(.22,.9,.32,1) .8s forwards;\n    margin: 0;\n    font-size: clamp(1rem, 1.6vw, 1.15rem);\n    line-height: 1.55;\n    color: color-mix(in srgb, var(--ink-deep) 72%, transparent);\n    max-width: 30rem;\n  }\n\n  .signup-wrap{\n    opacity: 0;\n    animation: rise .8s cubic-bezier(.22,.9,.32,1) .92s forwards;\n    width: 100%;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: .65rem;\n  }\n\n  .signup{\n    display: flex;\n    gap: .55rem;\n    width: 100%;\n    max-width: 25rem;\n  }\n  .signup input[type=\"email\"]{\n    flex: 1;\n    min-width: 0;\n    padding: .85rem 1.1rem;\n    border-radius: 999px;\n    border: 1.5px solid var(--line);\n    background: var(--paper-warm);\n    color: var(--ink-deep);\n    font: inherit;\n    font-size: .95rem;\n  }\n  .signup input[type=\"email\"]::placeholder{\n    color: color-mix(in srgb, var(--ink-deep) 42%, transparent);\n  }\n  .signup input[type=\"email\"]:focus-visible{\n    outline: 2px solid color-mix(in srgb, var(--accent-orange) 55%, transparent);\n    outline-offset: 2px;\n    border-color: var(--ink-mid);\n  }\n  .signup button{\n    flex-shrink: 0;\n    padding: .85rem 1.5rem;\n    border-radius: 999px;\n    border: none;\n    background: var(--ink-deep);\n    color: #fff;\n    font: inherit;\n    font-size: .95rem;\n    font-weight: 600;\n    cursor: pointer;\n    transition: background .2s ease, transform .15s ease;\n  }\n  .signup button:hover{ background: var(--ink-mid); }\n  .signup button:active{ transform: scale(.97); }\n  .signup button:disabled{ opacity: .6; cursor: progress; }\n  .signup button:focus-visible{\n    outline: 2px solid color-mix(in srgb, var(--accent-orange) 55%, transparent);\n    outline-offset: 2px;\n  }\n\n  @media (max-width: 420px){\n    .signup{ flex-direction: column; }\n  }\n\n  .signup-msg{\n    min-height: 1.3em;\n    margin: 0;\n    font-size: .85rem;\n    line-height: 1.5;\n    max-width: 26rem;\n  }\n  .signup-msg[data-state=\"success\"]{ color: var(--ink-mid); font-weight: 600; }\n  .signup-msg[data-state=\"error\"]{ color: var(--warn); }\n  .signup-msg a{ color: var(--ink-mid); text-decoration: underline; text-underline-offset: 2px; }\n\n  .signup-count{\n    margin: 0;\n    font-size: .78rem;\n    color: color-mix(in srgb, var(--ink-deep) 55%, transparent);\n    font-variant-numeric: tabular-nums;\n  }\n\n  footer{\n    opacity: 0;\n    animation: rise .8s cubic-bezier(.22,.9,.32,1) 1.08s forwards;\n    margin-top: .25rem;\n    display: flex;\n    align-items: center;\n    gap: .55rem;\n    font-size: .72rem;\n    font-weight: 600;\n    letter-spacing: .2em;\n    text-transform: uppercase;\n    color: color-mix(in srgb, var(--ink-mid) 70%, transparent);\n  }\n  footer svg{ width: 13px; height: 13px; animation: sway 3.2s ease-in-out infinite; transform-origin: 50% 90%; }\n  @keyframes sway{\n    0%, 100% { transform: rotate(-8deg); }\n    50% { transform: rotate(8deg); }\n  }\n\n  @keyframes rise{\n    to { opacity: 1; transform: translateY(0) scale(1); }\n  }\n\n  @media (prefers-reduced-motion: reduce){\n    .mark, .eyebrow, h1, .rule, .sub, .signup-wrap, footer{ animation: none; opacity: 1; transform: none; }\n    .rule::after, .blob, footer svg{ animation: none; }\n  }\n<\/style>\n\n<div class=\"field\" aria-hidden=\"true\">\n  <div class=\"blob blob--teal\"><\/div>\n  <div class=\"blob blob--orange\"><\/div>\n<\/div>\n\n<main>\n  <img class=\"mark\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA4QAAAHSCAYAAAC0BgX4AAEAAElEQVR42uz9eXxcV50n/H/PuWvtVdp3yba8ybvl2I4TR3YSJ85CQiAyW+gA3WOGQIYJgYdAz/MTej1DN0x3Og+ STATE_JSON__<\/script>\n<script>\n(function(){\n  \"use strict\";\n\n  var TEMPLATE = __TEMPLATE_SELF__;\n  var FALLBACK_EMAIL = \"hello@nutriklin.com\";\n\n  function scriptSafe(jsonStr){ return jsonStr.split(\"<\/\").join(\"<\\\\/\"); }\n\n  function renderPage(state){\n    return TEMPLATE\n      .replace(\"__TEMPLATE_SELF__\", scriptSafe(JSON.stringify(TEMPLATE)))\n      .replace(\"__STATE_JSON__\", scriptSafe(JSON.stringify(state)));\n  }\n\n  var STATE;\n  try { STATE = JSON.parse(document.getElementById(\"state-data\").textContent); }\n  catch (e) { STATE = { signups: [] }; }\n  if (!STATE || !Array.isArray(STATE.signups)) STATE = { signups: [] };\n\n  var form = document.getElementById(\"signup-form\");\n  var emailInput = document.getElementById(\"signup-email\");\n  var btn = document.getElementById(\"signup-btn\");\n  var msg = document.getElementById(\"signup-msg\");\n  var countEl = document.getElementById(\"signup-count\");\n\n  function setMsg(text, state){\n    msg.textContent = text;\n    if (state) msg.setAttribute(\"data-state\", state);\n    else msg.removeAttribute(\"data-state\");\n  }\n\n  function clearPending(){\n    try {\n      sessionStorage.removeItem(\"nk_pending_email\");\n      sessionStorage.removeItem(\"nk_retry_count\");\n    } catch (e) {}\n  }\n\n  function isValidEmail(v){\n    return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(v);\n  }\n\n  function alreadyIn(email){\n    var e = (email || \"\").trim().toLowerCase();\n    return STATE.signups.some(function(s){ return (s.email || \"\").toLowerCase() === e; });\n  }\n\n  function updateCount(){\n    var n = STATE.signups.length;\n    if (n > 0){\n      countEl.hidden = false;\n      countEl.textContent = (n === 1 ? \"1 person has\" : n + \" people have\") + \" already joined the list\";\n    }\n  }\n\n  function showFallback(){\n    form.hidden = true;\n    var mailto = \"mailto:\" + FALLBACK_EMAIL + \"?subject=\" + encodeURIComponent(\"Notify me \u2014 NutriKlin\");\n    msg.innerHTML = \"Live signups aren\u2019t available in this view \u2014 <a href=\\\"\" + mailto + \"\\\">email us directly<\/a> and we\u2019ll add you to the list.\";\n    msg.removeAttribute(\"data-state\");\n  }\n\n  async function submitEmail(email, isRetry){\n    if (!isRetry){\n      if (!isValidEmail(email)){ setMsg(\"That email doesn\u2019t look right \u2014 mind checking it?\", \"error\"); return; }\n      if (alreadyIn(email)){ setMsg(\"You\u2019re already on the list!\", \"success\"); return; }\n    }\n\n    btn.disabled = true;\n    if (!isRetry) setMsg(\"Joining\u2026\", null);\n\n    var capability = null;\n    if (window.claude && typeof window.claude.use === \"function\"){\n      try { capability = await window.claude.use(\"artifact\"); }\n      catch (e) { capability = null; }\n    }\n    if (!capability){\n      clearPending();\n      showFallback();\n      btn.disabled = false;\n      return;\n    }\n\n    try { sessionStorage.setItem(\"nk_pending_email\", email.trim()); } catch (e) {}\n\n    var newState = {\n      signups: STATE.signups.concat([{ email: email.trim(), ts: new Date().toISOString() }]),\n      updated: new Date().toISOString()\n    };\n\n    try {\n      await capability.publish(renderPage(newState));\n      // success \u2014 the runtime reloads every open view (this one too) to\n      // the new version; the pending-email check below picks it up there.\n      setTimeout(function(){\n        if (!document.hidden){\n          btn.disabled = false;\n          setMsg(\"Almost there \u2014 refreshing\u2026\", null);\n        }\n      }, 4000);\n    } catch (err) {\n      var code = err && err.code;\n      if (code === \"conflict\"){\n        // someone else published first; every open view (this one\n        // included) is already being reloaded to that version. Our\n        // pending-email flag survives the reload and retries there.\n        setTimeout(function(){\n          if (!document.hidden){\n            btn.disabled = false;\n            setMsg(\"Someone else joined at the same moment \u2014 please tap Notify Me again.\", null);\n          }\n        }, 4000);\n        return;\n      }\n      if (code === \"not_writer\" || code === \"not_granted\" || code === \"capability_disabled\" || code === \"not_declared\"){\n        clearPending();\n        showFallback();\n        btn.disabled = false;\n        return;\n      }\n      clearPending();\n      setMsg(\"Something went wrong \u2014 please try again in a moment.\", \"error\");\n      btn.disabled = false;\n    }\n  }\n\n  form.addEventListener(\"submit\", function(ev){\n    ev.preventDefault();\n    submitEmail(emailInput.value);\n  });\n\n  (function init(){\n    var pending = null;\n    try { pending = sessionStorage.getItem(\"nk_pending_email\"); } catch (e) {}\n\n    if (pending && alreadyIn(pending)){\n      clearPending();\n      form.hidden = true;\n      setMsg(\"You\u2019re on the list \u2014 thanks! We\u2019ll email you the moment we launch.\", \"success\");\n      return;\n    }\n\n    if (pending){\n      var retries = 0;\n      try { retries = parseInt(sessionStorage.getItem(\"nk_retry_count\") || \"0\", 10); } catch (e) {}\n      if (retries < 2){\n        try { sessionStorage.setItem(\"nk_retry_count\", String(retries + 1)); } catch (e) {}\n        submitEmail(pending, true);\n        return;\n      }\n      clearPending();\n    }\n\n    updateCount();\n  })();\n})();\n<\/script>\n";
  var FALLBACK_EMAIL = "hello@nutriklin.com";

  function scriptSafe(jsonStr){ return jsonStr.split("</").join("<\\/"); }

  function renderPage(state){
    return TEMPLATE
      .replace("__TEMPLATE_SELF__", scriptSafe(JSON.stringify(TEMPLATE)))
      .replace("__STATE_JSON__", scriptSafe(JSON.stringify(state)));
  }

  var STATE;
  try { STATE = JSON.parse(document.getElementById("state-data").textContent); }
  catch (e) { STATE = { signups: [] }; }
  if (!STATE || !Array.isArray(STATE.signups)) STATE = { signups: [] };

  var form = document.getElementById("signup-form");
  var emailInput = document.getElementById("signup-email");
  var btn = document.getElementById("signup-btn");
  var msg = document.getElementById("signup-msg");
  var countEl = document.getElementById("signup-count");

  function setMsg(text, state){
    msg.textContent = text;
    if (state) msg.setAttribute("data-state", state);
    else msg.removeAttribute("data-state");
  }

  function clearPending(){
    try {
      sessionStorage.removeItem("nk_pending_email");
      sessionStorage.removeItem("nk_retry_count");
    } catch (e) {}
  }

  function isValidEmail(v){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  function alreadyIn(email){
    var e = (email || "").trim().toLowerCase();
    return STATE.signups.some(function(s){ return (s.email || "").toLowerCase() === e; });
  }

  function updateCount(){
    var n = STATE.signups.length;
    if (n > 0){
      countEl.hidden = false;
      countEl.textContent = (n === 1 ? "1 person has" : n + " people have") + " already joined the list";
    }
  }

  function showFallback(){
    form.hidden = true;
    var mailto = "mailto:" + FALLBACK_EMAIL + "?subject=" + encodeURIComponent("Notify me — NutriKlin");
    msg.innerHTML = "Live signups aren’t available in this view — <a href=\"" + mailto + "\">email us directly</a> and we’ll add you to the list.";
    msg.removeAttribute("data-state");
  }

  async function submitEmail(email, isRetry){
    if (!isRetry){
      if (!isValidEmail(email)){ setMsg("That email doesn’t look right — mind checking it?", "error"); return; }
      if (alreadyIn(email)){ setMsg("You’re already on the list!", "success"); return; }
    }

    btn.disabled = true;
    if (!isRetry) setMsg("Joining…", null);

    var capability = null;
    if (window.claude && typeof window.claude.use === "function"){
      try { capability = await window.claude.use("artifact"); }
      catch (e) { capability = null; }
    }
    if (!capability){
      clearPending();
      showFallback();
      btn.disabled = false;
      return;
    }

    try { sessionStorage.setItem("nk_pending_email", email.trim()); } catch (e) {}

    var newState = {
      signups: STATE.signups.concat([{ email: email.trim(), ts: new Date().toISOString() }]),
      updated: new Date().toISOString()
    };

    try {
      await capability.publish(renderPage(newState));
      // success — the runtime reloads every open view (this one too) to
      // the new version; the pending-email check below picks it up there.
      setTimeout(function(){
        if (!document.hidden){
          btn.disabled = false;
          setMsg("Almost there — refreshing…", null);
        }
      }, 4000);
    } catch (err) {
      var code = err && err.code;
      if (code === "conflict"){
        // someone else published first; every open view (this one
        // included) is already being reloaded to that version. Our
        // pending-email flag survives the reload and retries there.
        setTimeout(function(){
          if (!document.hidden){
            btn.disabled = false;
            setMsg("Someone else joined at the same moment — please tap Notify Me again.", null);
          }
        }, 4000);
        return;
      }
      if (code === "not_writer" || code === "not_granted" || code === "capability_disabled" || code === "not_declared"){
        clearPending();
        showFallback();
        btn.disabled = false;
        return;
      }
      clearPending();
      setMsg("Something went wrong — please try again in a moment.", "error");
      btn.disabled = false;
    }
  }

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    submitEmail(emailInput.value);
  });

  (function init(){
    var pending = null;
    try { pending = sessionStorage.getItem("nk_pending_email"); } catch (e) {}

    if (pending && alreadyIn(pending)){
      clearPending();
      form.hidden = true;
      setMsg("You’re on the list — thanks! We’ll email you the moment we launch.", "success");
      return;
    }

    if (pending){
      var retries = 0;
      try { retries = parseInt(sessionStorage.getItem("nk_retry_count") || "0", 10); } catch (e) {}
      if (retries < 2){
        try { sessionStorage.setItem("nk_retry_count", String(retries + 1)); } catch (e) {}
        submitEmail(pending, true);
        return;
      }
      clearPending();
    }

    updateCount();
  })();
})();
</script>
